events {}

http {
    resolver 127.0.0.11 valid=10s;

    # ---- RPN (Next.js) ----
    server {
        listen 80;
        server_name rpn.mondomaine.com;
        location / {
            set $upstream_rpn http://rpn_app:3000;
            proxy_pass $upstream_rpn;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ---- NETFLIX : front et backend ----
    server {
        listen 80;
        server_name netflix.mondomaine.com;
        location / {
            set $upstream_netflix http://frontend:5173;
            proxy_pass $upstream_netflix;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            set $upstream_api http://api:8000;
            proxy_pass $upstream_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
}