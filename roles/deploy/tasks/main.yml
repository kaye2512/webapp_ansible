---
- name: Installer python3-docker
  ansible.builtin.apt:
    name:
      - python3-docker
    state: present
    update_cache: true
    
- name: deploy netflix stack
  ansible.builtin.import_tasks: netflix.yml
  tags:  
    - netflix

- name: deploy rpn stack
  ansible.builtin.import_tasks: rpn.yml
  tags:  
    - rpn

- name: deploy traefik stack
  ansible.builtin.import_tasks: traefik.yml
  tags:  
    - traefik