services:
  prometheus:
    image: prom/prometheus:v3.13.0@sha256:c6b27ea434f8389bfe233fbc7be381cf50587c286e871bc842008f5a1b1908a7  # Prometheus 3.13 (LTS : v3.5.x)
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/opt/prometheus/prometheus.yml
      - ./alerts.yml:/opt/prometheus/alerts.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    networks:
      - traefik-public

  node-exporter:
    image: prom/node-exporter:v1.11.1@sha256:e9cff4fc67b1818f8c97adb115b9f12c9a54b533de86765d4a0effc01b357205  # node_exporter 1.11.1
    ports:
      - "9100:9100"

  alertmanager:
    image: prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d  # Alertmanager 0.33.1
    ports:
      - "9093:9093"

networks:
  traefik-public:
    external: true