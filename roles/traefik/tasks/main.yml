---
- name: Créer le répertoire de déploiement Traefik
  ansible.builtin.file:
    path: /opt/traefik
    state: directory
    mode: '0755'
    
- name: Créer le fichier acme.json pour les certificats Let's Encrypt
  ansible.builtin.file:
    path: /opt/traefik/acme.json
    state: touch
    mode: '0600'

- name: Créer le réseau partagé traefik-public
  community.docker.docker_network:
    name: traefik-public
    driver: bridge
    attachable: true
    
- name: Créer le fichier .env avec le token deSEC
  ansible.builtin.copy:
    dest: /opt/traefik/.env
    content: "DESEC_TOKEN={{ vault_desec_token }}\n"
    mode: '0600'
  no_log: true

- name: Créer le répertoire de configuration Traefik
  ansible.builtin.file:
    path: /opt/traefik/config/
    state: directory
    mode: '0755'

- name: Créer le répertoire de configuration dynamic de Traefik
  ansible.builtin.file:
    path: /opt/traefik/config/conf.d
    state: directory
    mode: '0755'

- name: Copier le fichier de configuration statique Traefik
  ansible.builtin.copy:
    src: config/traefik.yaml
    dest: /opt/traefik/config/traefik.yaml

- name: Copier le fichier de configuration dynamique Traefik pour le dashboard
  ansible.builtin.copy:
    src: config/conf.d/config.yml
    dest: /opt/traefik/config/conf.d/config.yml

- name: Copier le docker-compose.yml pour traefik
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: /opt/traefik/docker-compose.yml

- name: Déployer Traefik
  community.docker.docker_compose_v2:
    project_src: /opt/traefik
    files:
      - docker-compose.yml
    state: present
  become: true
  changed_when: true
