services:
  traefik:
    image: traefik:v3.7.6@sha256:21a3d83696379bac6434bb32e1dde0aff0e84ef2abd053ed3db87d3f45e749b2
    container_name: traefik
    restart: unless-stopped
    env_file:
      - /opt/traefik/.env
    ports:
      - "80:80"
      - "8080:8080"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/traefik/config/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - /opt/traefik/config/conf.d:/opt/traefik/conf.d:ro
      - /opt/traefik/acme.json:/opt/traefik/acme.json
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true