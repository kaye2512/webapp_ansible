http:
  routers:
    dashboard:
      rule: "Host(`traefiks.kayedev.dedyn.io`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))"
      service: api@internal
      entryPoints:
        - websecure
      middlewares:
        - dashboard-auth
      tls:
        certResolver: letsencrypt

    netflix:
      rule: "Host(`netflix.kayedev.dedyn.io`)"
      service: netflix
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt

    prometheus:
      rule: "Host(`prometheus.kayedev.dedyn.io`)"
      service: prometheus
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt

    grafana:
      rule: "Host(`grafana.kayedev.dedyn.io`)"
      service: grafana
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
  services:
    netflix:
      loadBalancer:
        servers:
          - url: "http://netflix:8080"  
    prometheus:
      loadBalancer:
        servers:
          - url: "http://prometheus:9090"
    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"
  middlewares:
    dashboard-auth:
      basicAuth:
        users:
          # admin:password (généré avec htpasswd -nb admin password)
          - "admin:$apr1$khzWF3n3$TzBxAp0TIfOjd8A1EASlc1"